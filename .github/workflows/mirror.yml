name: Mirror PropTech RSS feeds

on:
  schedule:
    # 05:45 UTC daily — 25 min before the SHUM PropTech Sources cloud routine runs at 06:10 UTC
    - cron: "45 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          mkdir -p feeds
          curl -sSL --max-time 30 -o feeds/techcrunch-proptech.xml "https://techcrunch.com/tag/proptech/feed/"
          curl -sSL --max-time 30 -o feeds/rightmove-techblog.xml "https://rightmove.blog/feed/"

      - name: Commit if changed
        run: |
          git config user.name "shum-proptech-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "No changes in either feed today."
          else
            git commit -m "Update RSS snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
