name: Mirror PropTech RSS feeds

on:
  schedule:
    # 22:13 UTC (~8h buffer before the SHUM PropTech Sources cloud routine's 06:10 UTC run).
    # Moved earlier on 2026-09-04: the original 05:45 UTC slot left only ~25 min of buffer,
    # and GitHub Actions' own scheduler delayed the first real run by ~4h11m (fired 09:56 UTC
    # instead of 05:45) — a documented platform behavior for low-traffic public repos, not a
    # misconfiguration. Off round-hour minute (:13) per GitHub's own recommendation to avoid
    # top-of-hour queueing load.
    - cron: "13 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          mkdir -p feeds
          # 2026-09-09 fix: plain curl with no User-Agent was silently served a stale/
          # cached response (likely CDN or bot-protection reacting to a non-browser
          # client) — feed content was byte-identical for 6 days despite the sources
          # posting normally. A realistic browser User-Agent + Accept header fixes this.
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sSL --max-time 30 -A "$UA" -H "Accept: application/rss+xml, application/xml, text/xml, */*" -o feeds/techcrunch-proptech.xml "https://techcrunch.com/tag/proptech/feed/"
          curl -sSL --max-time 30 -A "$UA" -H "Accept: application/rss+xml, application/xml, text/xml, */*" -o feeds/rightmove-techblog.xml "https://rightmove.blog/feed/"

      - name: Validate fetched feeds
        run: |
          # Fail loudly instead of silently committing a Cloudflare challenge page,
          # an empty response, or other non-feed content as if it were real data.
          for f in feeds/techcrunch-proptech.xml feeds/rightmove-techblog.xml; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty" >&2
              exit 1
            fi
            if ! grep -q "<rss" "$f" && ! grep -q "<feed" "$f"; then
              echo "ERROR: $f does not look like a real RSS/Atom feed (no <rss> or <feed> tag found) — first 300 bytes:" >&2
              head -c 300 "$f" >&2
              exit 1
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "shum-proptech-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "No changes in either feed today."
          else
            git commit -m "Update RSS snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
