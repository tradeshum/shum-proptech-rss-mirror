name: Mirror PropTech RSS feeds

on:
  schedule:
    # 22:13 UTC (~8h buffer before the SHUM PropTech Sources cloud routine's 06:10 UTC run).
    # Moved earlier on 2026-09-04: the original 05:45 UTC slot left only ~25 min of buffer,
    # and GitHub Actions' own scheduler delayed the first real run by ~4h11m (fired 09:56 UTC
    # instead of 05:45) — a documented platform behavior for low-traffic public repos, not a
    # misconfiguration. Off round-hour minute (:13) per GitHub's own recommendation to avoid
    # top-of-hour queueing load.
    - cron: "13 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          mkdir -p feeds
          curl -sSL --max-time 30 -o feeds/techcrunch-proptech.xml "https://techcrunch.com/tag/proptech/feed/"
          curl -sSL --max-time 30 -o feeds/rightmove-techblog.xml "https://rightmove.blog/feed/"

      - name: Commit if changed
        run: |
          git config user.name "shum-proptech-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "No changes in either feed today."
          else
            git commit -m "Update RSS snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
