name: Mirror PropTech RSS feeds

on:
  schedule:
    # 22:13 UTC (~8h buffer before the SHUM PropTech Sources cloud routine's 06:10 UTC run).
    # Moved earlier on 2026-09-04: the original 05:45 UTC slot left only ~25 min of buffer,
    # and GitHub Actions' own scheduler delayed the first real run by ~4h11m (fired 09:56 UTC
    # instead of 05:45) — a documented platform behavior for low-traffic public repos, not
    # a misconfiguration. Off round-hour minute (:13) per GitHub's own recommendation to avoid
    # top-of-hour queueing load.
    - cron: "13 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-09-10 fix: each feed fetches in its OWN step with continue-on-error, and retries
      # on transient failures (curl's --retry-all-errors covers HTTP 429/5xx, not just
      # connection-level errors). One feed's failure can never block the others' update.
      #
      # 2026-09-12 source swap: TechCrunch's proptech tag and CRETech (never added — its
      # advertised RSS feed at cretech.com/news/rss.xml returns 0 <item> entries, verified live)
      # were dropped for genuinely dead/broken feeds. Replaced with Geek Estate Blog, HousingWire
      # (general feed — no per-topic RSS category, so the cloud routine itself filters for
      # tech/proptech relevance from the firehose) and Propmodo. GlobeSt and Realcomm were also
      # checked and rejected: GlobeSt's /feed/ returns their normal HTML page (no real RSS at
      # that path), Realcomm's feed literally responds "Realcomm Is Sorry..." (broken).
      - name: Fetch Geek Estate Blog feed
        id: fetch_geekestate
        continue-on-error: true
        run: |
          mkdir -p feeds
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sSL --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -A "$UA" -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            -o feeds/geekestate-blog.xml "https://www.geekestateblog.com/feed/"

      - name: Fetch Rightmove Tech Blog feed
        id: fetch_rightmove
        continue-on-error: true
        run: |
          mkdir -p feeds
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          # Longer retry-delay than the others — rightmove.blog is the one that 429'd once
          # before, so back off harder specifically for it rather than hammering it 3x quickly.
          curl -sSL --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -A "$UA" -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            -o feeds/rightmove-techblog.xml "https://rightmove.blog/feed/"

      - name: Fetch HousingWire feed
        id: fetch_housingwire
        continue-on-error: true
        run: |
          mkdir -p feeds
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          # General feed, not the tag/proptech one — that tag is thin (~monthly). The cloud
          # routine filters this firehose for tech/proptech-relevant items itself.
          curl -sSL --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -A "$UA" -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            -o feeds/housingwire-general.xml "https://www.housingwire.com/feed/"

      - name: Fetch Propmodo feed
        id: fetch_propmodo
        continue-on-error: true
        run: |
          mkdir -p feeds
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sSL --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -A "$UA" -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            -o feeds/propmodo.xml "https://www.propmodo.com/feed/"

      - name: Validate each feed independently
        run: |
          # A bad/missing feed is reverted to its last committed version and the job keeps
          # going — never `exit 1`s the whole job over one feed, so feeds that DID fetch
          # cleanly this run still get committed even if another failed or came back
          # empty/malformed (a Cloudflare challenge page, a 429 body, a truncated response).
          for f in geekestate-blog.xml rightmove-techblog.xml housingwire-general.xml propmodo.xml; do
            path="feeds/$f"
            if [ ! -s "$path" ] || { ! grep -q "<rss" "$path" && ! grep -q "<feed" "$path"; }; then
              echo "WARNING: $path is empty or not a real RSS/Atom feed — reverting to the last committed version instead of failing the job." >&2
              if [ -f "$path" ]; then
                echo "  First 300 bytes of the bad response:" >&2
                head -c 300 "$path" >&2
                echo >&2
              fi
              git checkout -- "$path" 2>/dev/null && echo "  Reverted $path to last committed version." \
                || echo "  No prior committed version of $path to revert to (leaving as-is)."
            else
              echo "OK: $path validated"
            fi
          done

      - name: Remove retired feed
        run: |
          # techcrunch-proptech.xml is retired (source dead since Feb 2026) — remove it from
          # the repo now that the replacement feeds are in place.
          git rm -f --ignore-unmatch feeds/techcrunch-proptech.xml

      - name: Commit if changed
        run: |
          git config user.name "shum-proptech-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "No changes in any feed today."
          else
            git commit -m "Update RSS snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
